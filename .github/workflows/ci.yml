name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        cache: true

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run ESLint
      run: pnpm lint

    - name: Run TypeScript check and build
      run: pnpm build

    - name: Run tests
      run: pnpm test

    - name: Check bundle size budgets
      run: pnpm check:size

    - name: Run Lighthouse CI
      run: pnpm lighthouse

    - name: Output Lighthouse report summary
      if: always()
      run: |
        if [ -f .lighthouseci/links.json ]; then
          node -e '
            const fs = require("fs");
            const links = JSON.parse(fs.readFileSync(".lighthouseci/links.json", "utf8"));
            console.log("==========================================");
            console.log("   Lighthouse CI Report Links (Public)    ");
            console.log("==========================================");
            let summary = "### 🏸 Lighthouse CI Reports\n\n| Tested URL | Report Link |\n| :--- | :--- |\n";
            for (const [url, reportUrl] of Object.entries(links)) {
              console.log(`${url} -> ${reportUrl}`);
              summary += `| \`${url}\` | [View Report](${reportUrl}) |\n`;
            }
            console.log("==========================================");
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            }
          '
        fi
